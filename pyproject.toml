[project]
name = "oushodh"
dynamic = ["version"]
description = "Python SDK for the Oushodh medicine data API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oushodh", email = "support@oushodh.dev" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://oushodh.dev"
Documentation = "https://oushodh.dev/docs"
Repository = "https://github.com/oushodh/oushodh-python"
Changelog = "https://github.com/oushodh/oushodh-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["mypy>=2.4.1", "pytest>=9.2.0", "ruff>=0.17.4"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oushodh/_version.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
